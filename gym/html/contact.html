<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Girls Gym</title>
  <link rel="stylesheet" href="../css/style.css">
  <!-- مكتبة Font Awesome للأيقونات -->

<body>
  <header>
    <h1>Contact Us</h1>
    <nav>
      <ul>
<li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="programs.html">Programs</a></li>
        <li><a href="trainers.html">Trainers</a></li>
        <li><a href="account.html">Account</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  
  <main class="content">
    <section>
      <h2>Get in Touch</h2>
      <form onsubmit="validateForm(event)">
        <p>
          <label for="name"><i class="fa fa-user"></i></label>
          <input type="text" id="name" placeholder="Your Name">
        </p>
        <p>
          <label for="email"><i class="fa fa-envelope"></i></label>
          <input type="email" id="email" placeholder="Your Email">
        </p>
        
        <!-- Dropdown -->
        <p>
          <label for="department"><i class="fa fa-building"></i> Contact With:</label>
          <select id="department" name="department">
            <option value="support">Support</option>
            <option value="membership">Membership</option>
            <option value="trainers">Trainers</option>
            <option value="management">Management</option>
          </select>
        </p>

        <p>
          <label for="message"><i class="fa fa-comment"></i></label>
          <textarea id="message" placeholder="Your Message"></textarea>
        </p>
        <button type="submit">
          <i class="fa fa-paper-plane"></i> Send
        </button>
      </form>
    </section>

    <aside>
      <h3>Contact Info</h3>
      <p><i class="fas fa-phone"></i>778697533</p>
       <p><i class="fa-solid fa-envelope"></i> info@girlsgym.com</p>
      <p><i class="fa-solid fa-location-dot"></i>Sana'a, Yemen</p>

     
      <h3>Follow Us</h3>
      <p>
        <a href="#"><i class="fa-brands fa-facebook"></i>  Facebook</a><br> 
        <a href="#"><i class="fa-brands fa-instagram"></i> Instagram</a><br>
        <a href="#"><i class="fa-brands fa-twitter"></i>Twitter</a>
      </p>
    </aside>
  </main>

  <footer>
    <p>&copy; 2026 Girls Gym</p>
  </footer>
   <script src="../js/java.js"></script>

</body>
</html>
